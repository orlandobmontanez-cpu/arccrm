  JOB BOARD — read-only view of the CRM.
  Reads localStorage arc_v3 + arc_ext (same site, same phone) and NEVER writes to them.
  Do not add setItem / removeItem calls for CRM keys here.
-->
<style>
  :root {
    --stone: #EAE4DA; --stone-dark: #D8CFC3; --ink: #1C1A18; --ink-soft: #3A3734; --ink-muted: #6B655E;
    --copper: #974930; --mid: #C97E78; --hi: #F0C8C2; --white: #FDFBF8; --gray: #A79F95;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--stone); color: var(--ink); font-family: 'Inter', sans-serif; }
  body { min-height: 100dvh; padding-bottom: env(safe-area-inset-bottom); }
  .wrap { max-width: 980px; margin: 0 auto; padding: 0 16px 40px; }

  header { position: sticky; top: 0; z-index: 1000; background: var(--ink); color: var(--stone);
    padding: calc(10px + env(safe-area-inset-top)) 16px 10px; }
  .hd { max-width: 980px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
  .back { display: inline-flex; align-items: center; min-height: 48px; padding: 0 14px; border: 1px solid rgba(234,228,218,.25);
    border-radius: 6px; color: var(--stone); text-decoration: none; font-family: 'Bebas Neue', sans-serif; letter-spacing: .12em; font-size: 15px; }
  .ttl { flex: 1; line-height: 1; }
  .ttl b { display: block; font-family: 'Anton', sans-serif; font-weight: 400; font-size: 22px; letter-spacing: .04em; }
  .ttl span { font-family: 'Bebas Neue', sans-serif; color: var(--mid); letter-spacing: .2em; font-size: 13px; }

  .period { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin: 16px 0 6px; }
  .period button { min-height: 48px; padding: 0 4px; white-space: nowrap; border: 1px solid var(--stone-dark); background: var(--white);
    border-radius: 6px; font-family: 'Bebas Neue', sans-serif; font-size: 14px; letter-spacing: .06em; color: var(--ink-soft); cursor: pointer; }
  .period button.on { background: var(--ink); color: var(--stone); border-color: var(--ink); }
  .note { font-size: 11px; color: var(--ink-muted); line-height: 1.5; }

  h2 { font-family: 'Bebas Neue', sans-serif; font-weight: 400; font-size: 20px; letter-spacing: .14em; color: var(--ink); margin: 26px 0 4px; }
  h2 + .rule { height: 2px; background: var(--copper); width: 44px; margin-bottom: 12px; }

  .kpis { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
  @media (min-width: 720px) { .kpis { grid-template-columns: repeat(4, minmax(0,1fr)); } }
  .kpi { background: var(--white); border: 1px solid var(--stone-dark); border-radius: 8px; padding: 12px 14px; }
  .kpi .l { font-family: 'Bebas Neue', sans-serif; letter-spacing: .12em; font-size: 13px; color: var(--ink-muted); }
  .kpi .v { font-family: 'Anton', sans-serif; font-size: 30px; line-height: 1.15; color: var(--ink); }
  .kpi .s { font-size: 11px; color: var(--ink-muted); margin-top: 2px; }
  .kpi.main { background: var(--ink); border-color: var(--ink); }
  .kpi.main .l { color: var(--mid); } .kpi.main .v { color: var(--stone); } .kpi.main .s { color: var(--gray); }

  .card { background: var(--white); border: 1px solid var(--stone-dark); border-radius: 8px; padding: 14px; }
  .read { border-left: 3px solid var(--copper); background: var(--white); padding: 12px 14px; border-radius: 0 8px 8px 0;
    font-size: 13px; line-height: 1.55; color: var(--ink-soft); margin-bottom: 10px; }
  .read b { color: var(--ink); }
  .cmp { display: grid; grid-template-columns: 1fr auto auto; gap: 8px 16px; font-size: 13px; align-items: baseline; }
  .cmp .h { font-family: 'Bebas Neue', sans-serif; letter-spacing: .12em; font-size: 13px; color: var(--ink-muted); text-align: right; }
  .cmp .h:first-child { text-align: left; }
  .cmp .n { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  .cmp .won { color: var(--copper); }
  .bands { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
  .band { display: grid; grid-template-columns: 92px 1fr 64px; gap: 10px; align-items: center; font-size: 12px; }
  .bar { height: 14px; background: var(--stone); border-radius: 3px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--copper); border-radius: 3px; }
  .band .p { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-soft); }

  .list { display: flex; flex-direction: column; gap: 8px; }
  .job { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; background: var(--white); border: 1px solid var(--stone-dark);
    border-radius: 8px; padding: 12px 14px; min-height: 56px; text-decoration: none; color: var(--ink); }
  .job .nm { font-weight: 600; font-size: 14px; }
  .job .ad { font-size: 12px; color: var(--ink-muted); grid-column: 1; }
  .job .rt { grid-column: 2; grid-row: 1 / span 2; text-align: right; align-self: center; }
  .job .amt { font-weight: 600; font-variant-numeric: tabular-nums; font-size: 14px; }
  .pill { display: inline-block; font-family: 'Bebas Neue', sans-serif; letter-spacing: .1em; font-size: 12px; padding: 2px 7px 1px; border-radius: 3px; margin-top: 3px; }
  .p-sched { background: var(--ink); color: var(--stone); }
  .p-prod { background: var(--copper); color: var(--white); }
  .p-wait { background: var(--hi); color: var(--copper); }
  .p-won { background: #E3EBDD; color: #3D5A2E; }
  .p-lost { background: #EFDCDA; color: #8A2E26; }
  .p-open { background: var(--stone); color: var(--ink-soft); }
  .day { font-family: 'Bebas Neue', sans-serif; letter-spacing: .12em; font-size: 14px; color: var(--copper); margin: 10px 0 2px; }
  .empty { font-size: 13px; color: var(--ink-muted); font-style: italic; padding: 10px 2px; }

  .pipe { display: flex; flex-direction: column; gap: 8px; }
  .stg { display: grid; grid-template-columns: 104px 1fr 110px; gap: 10px; align-items: center; font-size: 12px; }
  .stg .k { font-family: 'Bebas Neue', sans-serif; letter-spacing: .1em; font-size: 14px; }
  .stg .c { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-soft); }

  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 10px; }
  .tabs button { min-height: 48px; border: 1px solid var(--stone-dark); background: var(--white); border-radius: 6px;
    font-family: 'Bebas Neue', sans-serif; font-size: 15px; letter-spacing: .1em; color: var(--ink-soft); cursor: pointer; }
  .tabs button.on { background: var(--ink); color: var(--stone); border-color: var(--ink); }

  #map { height: 420px; border-radius: 8px; border: 1px solid var(--stone-dark); background: #E9E5DF; }
  #map .leaflet-tile-pane { filter: grayscale(1) sepia(.25) brightness(1.04) contrast(.92); }
  .leaflet-popup-content { font-family: 'Inter', sans-serif; font-size: 12px; line-height: 1.5; margin: 10px 12px; }
  .leaflet-popup-content b { font-size: 13px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 11px; color: var(--ink-soft); margin: 8px 0 4px; }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; vertical-align: -2px; margin-right: 5px; border: 1.5px solid var(--ink); }
  .map-msg { font-size: 12px; color: var(--ink-muted); margin-top: 6px; }
  table.areas { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 12px; table-layout: fixed; }
  table.areas th { font-family: 'Bebas Neue', sans-serif; letter-spacing: .1em; font-weight: 400; font-size: 13px; color: var(--ink-muted);
    text-align: right; padding: 6px 4px; border-bottom: 1px solid var(--stone-dark); }
  table.areas th:first-child, table.areas td:first-child { text-align: left; width: 38%; }
  table.areas td { text-align: right; padding: 8px 4px; border-bottom: 1px solid var(--stone); font-variant-numeric: tabular-nums; }
  table.areas td small { display: block; color: var(--ink-muted); font-size: 11px; }
  footer { text-align: center; margin-top: 30px; font-family: 'Lora', serif; font-style: italic; color: var(--ink-muted); font-size: 13px; }
</style>
</head>

    var now = new Date(), from;
    if (period === 'year') from = new Date(now.getFullYear(), 0, 1).getTime();
    else from = now.getTime() - parseInt(period, 10) * 86400000;
    return j.created >= from;
  }

  // ── Close rate ──
  function renderKpis(J) {
    var won = J.filter(function (j) { return WON[j.stage]; }), lost = J.filter(function (j) { return j.stage === 'Declined'; }),
      open = J.filter(function (j) { return j.stage === 'Proposed'; });
    var dec = won.length + lost.length;
    var wonD = won.reduce(function (s, j) { return s + j.price; }, 0), lostD = lost.reduce(function (s, j) { return s + j.price; }, 0),
      openD = open.reduce(function (s, j) { return s + j.price; }, 0);
    document.getElementById('kpis').innerHTML =
      kpi('Close rate', pct(won.length, dec), won.length + ' won of ' + dec + ' decided', true) +
      kpi('Won', money(wonD), dec ? pct(wonD, wonD + lostD) + ' of proposed dollars' : 'No decisions yet') +
      kpi('Avg won job', won.length ? money(wonD / won.length) : '—', lost.length ? 'Avg declined ' + money(lostD / lost.length) : 'Before tax') +
      kpi('Waiting on answer', String(open.length), open.length ? money(openD) + ' in proposals out' : 'Nothing pending');
    return { won: won, lost: lost, open: open };
  }
  function kpi(l, v, s, main) {
    return '<div class="kpi' + (main ? ' main' : '') + '"><div class="l">' + esc(l) + '</div><div class="v">' + esc(v) + '</div><div class="s">' + esc(s) + '</div></div>';
  }

  // ── Pricing check: are we priced too high or too low? ──
  function renderPricing(g) {
    var el = document.getElementById('pricing');
    var won = g.won, lost = g.lost, dec = won.length + lost.length;
    function avg(a, f) { var x = a.filter(function (j) { return f(j) > 0; }); return x.length ? x.reduce(function (s, j) { return s + f(j); }, 0) / x.length : 0; }
    var psf = function (j) { return j.size > 0 && j.price > 0 ? j.price / j.size : 0; };
    var wPsf = avg(won, psf), lPsf = avg(lost, psf), wAvg = avg(won, function (j) { return j.price; }), lAvg = avg(lost, function (j) { return j.price; });
    var rate = dec ? won.length / dec : 0;

    var read;
    if (dec < 5) read = 'Mark at least <b>5 jobs</b> as Signed or Declined to get a pricing read. So far: <b>' + dec + '</b>. Tip: when a customer says no, move them to <b>Declined</b> in the CRM so this stays honest.';
    else {
      read = 'You close <b>' + Math.round(rate * 100) + '%</b> of decided proposals. ';
      if (rate >= 0.7) read += 'That is high for roofing. You may be <b>leaving money on the table</b>; try a few points more margin on the next proposals and watch this number.';
      else if (rate < 0.25) read += 'That is low. Check whether declines cluster at a higher $/sq ft (below) or in certain areas (map). If not, the issue may be lead quality, not price.';
      else read += 'That is a healthy range. Use the $/sq ft gap and the price bands below to fine-tune.';
      if (wPsf && lPsf) {
        var gap = (lPsf - wPsf) / wPsf;
        if (gap > 0.1) read += ' Declined jobs ran <b>' + Math.round(gap * 100) + '% higher per sq ft</b> than jobs you won.';
        else if (gap < -0.1) read += ' Declined jobs were actually <b>cheaper per sq ft</b>, so price likely isn’t why you lost them.';
      }
    }
    var rows = '<div class="h">Before tax</div><div class="h">Won</div><div class="h">Declined</div>' +
      '<div>Average job</div><div class="n won">' + (wAvg ? money(wAvg) : '—') + '</div><div class="n">' + (lAvg ? money(lAvg) : '—') + '</div>' +
      '<div>Price per sq ft</div><div class="n won">' + (wPsf ? money2(wPsf) : '—') + '</div><div class="n">' + (lPsf ? money2(lPsf) : '—') + '</div>';

    var BANDS = [[0, 2500, 'Under $2.5k'], [2500, 7500, '$2.5k–7.5k'], [7500, 15000, '$7.5k–15k'], [15000, 1e12, '$15k+']];
    var bands = BANDS.map(function (b) {
      var w = won.filter(function (j) { return j.price >= b[0] && j.price < b[1]; }).length,
        l = lost.filter(function (j) { return j.price >= b[0] && j.price < b[1]; }).length;
      var r = w + l ? w / (w + l) : 0;
      return '<div class="band"><span>' + b[2] + '</span><div class="bar"><i style="width:' + Math.round(r * 100) + '%"></i></div>' +
        '<span class="p">' + (w + l ? Math.round(r * 100) + '% · ' + (w + l) : '—') + '</span></div>';
    }).join('');

    var types = ['replace', 'repair'].map(function (t) {
      var w = won.filter(function (j) { return (t === 'repair') === j.repair; }).length, l = lost.filter(function (j) { return (t === 'repair') === j.repair; }).length;
      return '<div>' + (t === 'repair' ? 'Repair / maintenance' : 'Replacement / coating') + '</div><div class="n won">' + w + ' won</div><div class="n">' + pct(w, w + l) + '</div>';
    }).join('');

    el.innerHTML = '<div class="read">' + read + '</div><div class="card"><div class="cmp">' + rows + '</div>' +
      '<div class="day" style="margin-top:16px">Close rate by job size</div><div class="bands">' + bands + '</div>' +
      '<div class="day" style="margin-top:16px">By quote type</div><div class="cmp">' + types + '</div></div>';
  }

  // ── Schedule: signed and in-production jobs ──
  function renderSchedule() {
    var el = document.getElementById('schedule');
    var active = ALL.filter(function (j) { return j.stage === 'Signed' || j.stage === 'In Production'; });
    var dated = active.filter(function (j) { return dateOf(j.c.scheddate); })
      .sort(function (a, b) { return dateOf(a.c.scheddate) - dateOf(b.c.scheddate); });
    var undated = active.filter(function (j) { return !dateOf(j.c.scheddate); });
    var today = new Date(); today.setHours(0, 0, 0, 0);
    var html = '', lastDay = '';
    dated.forEach(function (j) {
      var d = dateOf(j.c.scheddate), key = d.toDateString();
      if (key !== lastDay) {
        lastDay = key;
        var tag = d.getTime() === today.getTime() ? ' · TODAY' : d < today ? ' · PAST' : '';
        html += '<div class="day">' + esc(longDay(d).toUpperCase() + tag) + '</div>';
      }
      html += jobRow(j, j.stage === 'In Production' ? '<span class="pill p-prod">IN PRODUCTION</span>' : '<span class="pill p-sched">SCHEDULED</span>');
    });
    if (undated.length) {
      html += '<div class="day">SIGNED · NOT SCHEDULED YET</div>';
      undated.forEach(function (j) { html += jobRow(j, '<span class="pill p-wait">NEEDS A DATE</span>'); });
    }
    el.innerHTML = html ? '<div class="list">' + html + '</div>' : '<p class="empty">No signed jobs yet. Signed and In Production jobs show here by scheduled date.</p>';
  }

  function jobRow(j, pill) {
    var c = j.c;
    return '<a class="job" href="./?open=' + encodeURIComponent(c.id) + '"><span class="nm">' + esc(name(c)) + '</span>' +
      '<span class="rt"><span class="amt">' + money(j.price) + '</span><br>' + pill + '</span>' +
      '<span class="ad">' + esc([cityLine(c), c.rooftype, j.repair ? 'Repair' : ''].filter(Boolean).join(' · ') || 'No address') + '</span></a>';
  }

  // ── Pipeline ──
  function renderPipe(J) {
    var max = 1, rows = STAGES.map(function (s) {
      var x = J.filter(function (j) { return j.stage === s; });
      var d = x.reduce(function (t, j) { return t + j.price; }, 0);
      if (x.length > max) max = x.length;
      return { s: s, n: x.length, d: d };
    });
    document.getElementById('pipe').innerHTML = rows.map(function (r) {
      var col = r.s === 'Declined' ? '#A79F95' : WON[r.s] ? '#974930' : '#C97E78';
      return '<div class="stg"><span class="k">' + esc(r.s.toUpperCase()) + '</span><div class="bar"><i style="width:' + Math.round(r.n / max * 100) + '%;background:' + col + '"></i></div>' +
        '<span class="c">' + r.n + (r.n ? ' · ' + money(r.d) : '') + '</span></div>';
    }).join('');
  }

  // ── Accepted / declined ──
  function renderContracts(g) {
    var list = (ctab === 'won' ? g.won : g.lost).slice().sort(function (a, b) { return b.created - a.created; });
    document.getElementById('contracts').innerHTML = list.length ? list.map(function (j) {
      return jobRow(j, ctab === 'won' ? '<span class="pill p-won">' + esc(j.stage.toUpperCase()) + '</span>' : '<span class="pill p-lost">DECLINED</span>');
    }).join('') : '<p class="empty">' + (ctab === 'won' ? 'No accepted contracts in this period.' : 'No declined proposals in this period.') + '</p>';
  }

  // ── Map ──
  var map = null, layer = null;
  function areaStats(J) {
    var by = {}, cityPts = {};
    Object.keys(ZIPS).forEach(function (z) { var v = ZIPS[z], k = v[2].toLowerCase(); (cityPts[k] = cityPts[k] || []).push(v); });
    var off = 0;
    J.forEach(function (j) {
      if (j.stage === 'Lead' || j.stage === 'Inspected') return;
      var key = j.zip && ZIPS[j.zip] ? j.zip : '', pt;
      if (key) pt = ZIPS[key];
      else {
        var cp = cityPts[String(j.c.city || '').trim().toLowerCase()];
        if (!cp) { off++; return; }
        key = String(j.c.city).trim();
        pt = [cp.reduce(function (s, p) { return s + p[0]; }, 0) / cp.length, cp.reduce(function (s, p) { return s + p[1]; }, 0) / cp.length, key];
      }
      var a = by[key] = by[key] || { key: key, lat: pt[0], lng: pt[1], city: pt[2], won: 0, lost: 0, open: 0, wonD: 0 };
      if (WON[j.stage]) { a.won++; a.wonD += j.price; } else if (j.stage === 'Declined') a.lost++; else a.open++;
    });
    return { areas: Object.keys(by).map(function (k) { return by[k]; }), off: off };
  }
  function colorFor(a) {
    var d = a.won + a.lost; if (!d) return '#FDFBF8';
    var r = a.won / d; return r >= 0.5 ? '#974930' : r >= 0.25 ? '#C97E78' : '#A79F95';
  }
  function areaLabel(a) { return /^\d{5}$/.test(a.key) ? a.city + ' ' + a.key : a.key + ' (city)'; }

  function renderMap(J) {
    var st = areaStats(J), msg = document.getElementById('map-msg');
    var areas = st.areas.sort(function (a, b) { return (b.won + b.lost + b.open) - (a.won + a.lost + a.open); });
    // Ranked table (works even without signal)
    document.getElementById('areas').innerHTML = areas.length ?
      '<tr><th>Area</th><th>Won</th><th>Lost</th><th>Open</th><th>Close</th></tr>' + areas.map(function (a) {
        return '<tr><td>' + esc(areaLabel(a)) + (a.wonD ? '<small>' + money(a.wonD) + ' won</small>' : '') + '</td><td>' + a.won + '</td><td>' + a.lost + '</td><td>' + a.open + '</td><td>' + pct(a.won, a.won + a.lost) + '</td></tr>';
      }).join('') : '';
    var notes = [];
    if (!areas.length) notes.push('Proposals show on the map once they have a ZIP code or a city.');
    if (st.off) notes.push(st.off + ' proposal' + (st.off > 1 ? 's' : '') + ' without a ZIP or known city ' + (st.off > 1 ? 'are' : 'is') + ' not on the map.');

    if (!window.L) { notes.push('The map needs a signal to load. The area list below still works offline.'); msg.textContent = notes.join(' '); return; }
    msg.textContent = notes.join(' ');
    if (!map) {
      map = L.map('map', { scrollWheelZoom: false, tap: true }).setView([35.11, -106.62], 10);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors' }).addTo(map);
    }
    if (layer) layer.remove();
    layer = L.layerGroup().addTo(map);
    var bounds = [];
    areas.forEach(function (a) {
      var n = a.won + a.lost + a.open;
      L.circleMarker([a.lat, a.lng], { radius: Math.min(28, 7 + Math.sqrt(n) * 5), color: '#1C1A18', weight: 1.5,
        fillColor: colorFor(a), fillOpacity: 0.85 })
        .bindPopup('<b>' + esc(areaLabel(a)) + '</b><br>Close rate ' + pct(a.won, a.won + a.lost) + '<br>' + a.won + ' won · ' + a.lost + ' declined · ' + a.open + ' open' +
          (a.wonD ? '<br>' + money(a.wonD) + ' won' : ''))
        .addTo(layer);
      bounds.push([a.lat, a.lng]);
    });
    if (bounds.length > 1) map.fitBounds(bounds, { padding: [30, 30], maxZoom: 12 });
    else if (bounds.length === 1) map.setView(bounds[0], 12);
  }

  // ── Render ──
  function render() {
    var J = ALL.filter(inPeriod);
    var lbl = { '30': 'Last 30 days', '90': 'Last 90 days', year: 'This year', all: 'All time' }[period];
    document.getElementById('period-note').textContent = lbl + ' · by date the customer was added · ' + J.length + ' customer' + (J.length === 1 ? '' : 's') +
      '. Amounts are before tax. Data stays on this phone; this page only reads it.';
    document.querySelectorAll('#period button').forEach(function (b) { b.classList.toggle('on', b.dataset.p === period); });
    var g = renderKpis(J);
    renderPricing(g);
    renderSchedule();
    renderPipe(J);
    renderContracts(g);
    renderMap(J);
  }

  document.getElementById('period').addEventListener('click', function (e) {
    var b = e.target.closest('[data-p]'); if (!b) return;
    period = b.dataset.p;
    try { sessionStorage.setItem('arc_board_period', period); } catch (err) {}
    render();
  });
  document.getElementById('ctabs').addEventListener('click', function (e) {
    var b = e.target.closest('[data-t]'); if (!b) return;
    ctab = b.dataset.t;
    document.querySelectorAll('#ctabs button').forEach(function (x) { x.classList.toggle('on', x === b); });
    renderContracts(renderKpisSilent());
  });
  function renderKpisSilent() {
    var J = ALL.filter(inPeriod);
    return { won: J.filter(function (j) { return WON[j.stage]; }), lost: J.filter(function (j) { return j.stage === 'Declined'; }) };
  }

  window.addEventListener('load', render);
})();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" crossorigin="anonymous"></script>
